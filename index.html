<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RPG記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RPG記録</title>
<style>
  :root {
    --paper: #f4f1ea;
    --paper-2: #ebe6db;
    --ink: #1f1d1a;
    --ink-2: #5c574f;
    --ink-3: #8f887c;
    --line: #d6cfc1;
    --accent: #9b2d20;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    --sans: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { min-width: 0; }
  button, a, input, select, label { touch-action: manipulation; }
  body {
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
    min-height: 100vh; min-height: 100dvh;
    overflow-x: clip;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    padding: calc(12px + env(safe-area-inset-top)) 18px 10px;
    border-bottom: 1px solid var(--ink);
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  header.top h1 { font-family: var(--serif); font-size: 20px; margin: 0; font-weight: 600; letter-spacing: .04em; }
  header.top .lv { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  header.top .back { font-size: 14px; color: var(--ink-2); }

  main { padding: 0 max(18px, env(safe-area-inset-left)) 0 max(18px, env(safe-area-inset-right)); max-width: 640px; margin: 0 auto; }

  /* list */
  .tabs { display: flex; gap: 18px; overflow-x: auto; padding: 14px 0 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { padding: 6px 0 10px; font-size: 14px; color: var(--ink-3); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .tabs .n { font-family: var(--mono); font-size: 11px; margin-left: 3px; }

  .tools { display: flex; gap: 14px; padding: 12px 0; align-items: flex-end; }
  .tools select { flex: none; }
  .tools input { flex: 1; min-width: 0; }
  input[type=text], input[type=search], select, textarea {
    background: transparent; border: 0; border-bottom: 1px solid var(--line);
    padding: 6px 2px; border-radius: 0; outline: none; width: 100%; font-size: 16px;
    -webkit-appearance: none; appearance: none;
  }
  input:focus, select:focus, textarea:focus { border-bottom-color: var(--ink); }
  select { width: auto; padding-right: 14px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
    background-position: right 4px center, right 0 center; background-size: 4px 4px; background-repeat: no-repeat; font-size: 16px; padding-right: 16px; }

  ul.games { list-style: none; margin: 0; padding: 0; }
  ul.games li { border-bottom: 1px solid var(--line); }
  ul.games a { display: flex; gap: 12px; padding: 12px 0; text-decoration: none; align-items: center; }
  .thumb { width: 42px; height: 56px; flex: none; background: var(--paper-2); display: grid; place-items: center;
    font-family: var(--serif); color: var(--ink-3); font-size: 18px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .g-main { flex: 1; min-width: 0; }
  .g-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-side { text-align: right; flex: none; }
  .st { font-size: 11px; color: var(--ink-2); }
  .st.playing { color: var(--accent); }
  .stars { font-size: 12px; letter-spacing: 1px; color: var(--ink); }
  .stars .off { color: var(--line); }

  /* series group */
  .grp-head { display: flex; gap: 12px; padding: 12px 0; align-items: center; width: 100%; text-align: left; }
  .stack { position: relative; width: 42px; height: 56px; flex: none; }
  .stack::before, .stack::after { content: ""; position: absolute; border: 1px solid var(--line); background: var(--paper-2); width: 42px; height: 56px; }
  .stack::before { left: 6px; top: -4px; }
  .stack::after { left: 3px; top: -2px; }
  .stack .thumb { position: relative; z-index: 1; }
  .grp-head .g-title { font-family: var(--serif); }
  .grp-head .caret { font-size: 18px; line-height: 1; margin-left: 4px; font-family: var(--sans); color: var(--ink-2); transition: transform .15s; display: inline-block; }
  .grp.open .caret { transform: rotate(90deg); }
  .grp .cnt { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .grp ul { list-style: none; margin: 0 0 10px 20px; padding: 0 0 0 12px; border-left: 1px solid var(--ink); }
  .grp ul li { border-bottom: 1px solid var(--line); }
  .grp ul li:last-child { border-bottom: 0; }
  .grp ul a { padding: 9px 0; }
  .grp ul .thumb { width: 34px; height: 45px; font-size: 15px; }
  .sib { list-style: none; margin: 0; padding: 0; }
  .sib li { border-bottom: 1px solid var(--line); }
  .sib a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; text-decoration: none; font-size: 14px; }
  .sib .cur { color: var(--ink-3); }
  input[type=checkbox] { accent-color: var(--ink); width: 16px; height: 16px; }
  .empty { padding: 48px 0; color: var(--ink-3); font-size: 14px; text-align: center; }

  .fab { position: fixed; right: 18px; bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 6;
    width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: var(--paper);
    font-size: 28px; line-height: 54px; text-align: center; text-decoration: none; box-shadow: 0 2px 0 rgba(0,0,0,.15); }

  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--paper);
    border-top: 1px solid var(--ink); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav.bottom a { flex: 1; text-align: center; padding: 16px 0 12px; font-size: 13px; text-decoration: none; color: var(--ink-3); }
  nav.bottom a.on { color: var(--ink); font-weight: 600; }

  /* detail */
  .d-head { display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .d-img { width: 96px; height: 128px; flex: none; background: var(--paper-2); border: 1px solid var(--line);
    display: grid; place-items: center; font-family: var(--serif); font-size: 36px; color: var(--ink-3); overflow: hidden; }
  .d-img img { width: 100%; height: 100%; object-fit: cover; }
  .d-title { font-family: var(--serif); font-size: 21px; line-height: 1.35; margin: 0 0 6px; font-weight: 600; }
  .d-meta { font-size: 13px; color: var(--ink-2); }
  .d-head .stars { font-size: 16px; margin-top: 8px; }

  dl.kv { margin: 0; display: grid; grid-template-columns: 7em 1fr; }
  dl.kv dt, dl.kv dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  dl.kv dt { color: var(--ink-3); }

  h2.sec { font-family: var(--serif); font-size: 15px; font-weight: 600; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--ink); }
  .text { white-space: pre-wrap; font-size: 14px; }
  .muted { color: var(--ink-3); font-size: 13px; }

  .score-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
  .score-row .lab { width: 6em; color: var(--ink-2); }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 18px; height: 6px; background: var(--line); display: block; }
  .pips i.on { background: var(--ink); }

  .spoiler { border: 1px dashed var(--ink-3); padding: 12px; margin-top: 6px; }
  .spoiler button { color: var(--accent); font-size: 14px; }

  .actions { display: flex; gap: 20px; margin: 30px 0 10px; }
  .btn { display: inline-block; padding: 10px 18px; border: 1px solid var(--ink); font-size: 14px; text-decoration: none; background: transparent; }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.danger { border-color: var(--accent); color: var(--accent); }
  .btn.wide { width: 100%; text-align: center; padding: 13px; }

  /* form */
  form .f { padding: 12px 0 4px; }
  form label.l { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 2px; }
  form .req { color: var(--accent); }
  textarea { min-height: 90px; resize: vertical; border: 1px solid var(--line); padding: 8px; }
  textarea:focus { border-color: var(--ink); }
  .seg { display: flex; border: 1px solid var(--ink); margin-top: 4px; }
  .seg button { flex: 1; padding: 11px 0; font-size: 14px; border-right: 1px solid var(--ink); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .star-in { display: flex; gap: 4px; margin-top: 2px; }
  .star-in button { font-size: 32px; color: var(--line); line-height: 1; padding: 4px 6px 4px 0; }
  .star-in button.on { color: var(--ink); }
  .pip-in { display: flex; gap: 5px; flex: 1; }
  .pip-in button { flex: 1; max-width: 44px; height: 38px; border: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .pip-in button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .img-in { display: flex; gap: 14px; align-items: center; }
  .img-in .d-img { width: 72px; height: 96px; font-size: 13px; }
  .img-in .links { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .img-in .links button, .img-in .links label { text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }

  /* stats */
  .level { padding: 20px 0 16px; border-bottom: 1px solid var(--line); }
  .level .big { font-family: var(--serif); font-size: 30px; font-weight: 600; }
  .level .big small { font-size: 15px; margin-left: 8px; font-weight: 400; color: var(--ink-2); }
  .bar { height: 6px; background: var(--paper-2); border: 1px solid var(--line); margin: 10px 0 4px; }
  .bar > div { height: 100%; background: var(--ink); }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .nums div { padding: 14px 0; text-align: center; }
  .nums b { display: block; font-family: var(--mono); font-size: 22px; font-weight: 500; }
  .nums span { font-size: 11px; color: var(--ink-3); }
  table.dist { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.dist td { padding: 6px 0; vertical-align: middle; }
  table.dist td.k { width: 34%; padding-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
  table.dist td.v { width: 2.5em; text-align: right; font-family: var(--mono); color: var(--ink-2); }
  table.dist .b { height: 10px; background: var(--ink); min-width: 2px; }

  .note { font-size: 12px; color: var(--ink-3); margin: 8px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 8px 16px; font-size: 13px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .dlg { position: fixed; inset: 0; background: rgba(31,29,26,.45); z-index: 30; display: grid; place-items: center; padding: 24px; }
  .dlg > div { background: var(--paper); border: 1px solid var(--ink); padding: 20px; max-width: 340px; width: 100%; }
  .dlg p { margin: 0 0 18px; white-space: pre-wrap; font-size: 14px; }
  .dlg .row { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<nav class="bottom" id="nav">
  <a href="#/" data-tab="list">一覧</a>
  <a href="#/stats" data-tab="stats">統計</a>
  <a href="#/settings" data-tab="settings">設定</a>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- 定数 ---------- */
const STATUS = [
  { id: "playing", label: "プレイ中" },
  { id: "cleared", label: "クリア" },
  { id: "backlog", label: "積み" },
  { id: "dropped", label: "中断" },
];
const STATUS_LABEL = Object.fromEntries(STATUS.map(s => [s.id, s.label]));
const SCORE_KEYS = [
  { id: "story", label: "ストーリー" },
  { id: "battle", label: "戦闘" },
  { id: "music", label: "音楽" },
  { id: "graphic", label: "グラフィック" },
];
const PLATFORMS = ["Switch 2", "Switch", "PS5", "PS4", "PS3", "PS Vita", "PSP", "3DS", "DS", "Xbox", "PC", "スマホ", "SFC", "GBA"];
const GENRES = ["JRPG", "ARPG", "SRPG", "MMORPG", "ローグライク", "ダンジョンRPG", "オープンワールド"];
const TITLES = [
  [1, "村人"], [3, "見習い"], [5, "旅人"], [8, "冒険者"], [12, "戦士"],
  [16, "騎士"], [20, "勇者"], [25, "英雄"], [32, "伝説"],
];

/* ---------- 保存（IndexedDB） ---------- */
const DB_NAME = "rpg-log", STORE = "games";
let dbp = null;
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: "id" });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const s = t.objectStore(STORE);
    const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = () => tx("readonly", s => s.getAll());
const dbPut = g => tx("readwrite", s => s.put(g));
const dbDel = id => tx("readwrite", s => s.delete(id));
const dbClear = () => tx("readwrite", s => s.clear());

let games = [];
const ui = { tab: "all", sort: "updated", q: "", group: true, open: new Set() };

/* ---------- 便利関数 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const find = id => games.find(g => g.id === id);
function stars(n, total = 5) {
  n = n || 0;
  return `<span class="stars">${"★".repeat(n)}<span class="off">${"★".repeat(total - n)}</span></span>`;
}
function thumb(g, cls = "thumb") {
  return `<div class="${cls}">${g.image ? `<img src="${g.image}" alt="">` : esc((g.title || "?").trim().charAt(0))}</div>`;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1600);
}
function ask(msg, buttons) {
  // buttons: [{label, value, cls}]
  return new Promise(res => {
    const d = document.createElement("div");
    d.className = "dlg";
    d.innerHTML = `<div><p>${esc(msg)}</p><div class="row">${buttons.map((b, i) => `<button class="btn wide ${b.cls || ""}" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div>`;
    d.onclick = e => {
      const b = e.target.closest("button[data-i]");
      if (b || e.target === d) { d.remove(); res(b ? buttons[+b.dataset.i].value : null); }
    };
    document.body.appendChild(d);
  });
}
const yesNo = (msg, yes) => ask(msg, [{ label: yes, value: true, cls: "danger" }, { label: "やめる", value: false }]);
const byTitle = (a, b) => {
  const oa = a.seriesOrder || Infinity, ob = b.seriesOrder || Infinity;
  return oa !== ob ? (oa < ob ? -1 : 1) : a.title.localeCompare(b.title, "ja", { numeric: true });
};
function seriesCounts() {
  const m = {};
  games.forEach(g => { if (g.series) m[g.series] = (m[g.series] || 0) + 1; });
  return m;
}
function uniq(list) { return [...new Set(list.filter(Boolean))]; }

/* ---------- 経験値 ---------- */
function gameExp(g) {
  let e = { cleared: 100, playing: 30, dropped: 20, backlog: 0 }[g.status] || 0;
  if (g.rating) e += 10;
  if ((g.review || "").trim()) e += 20;
  if (g.image) e += 5;
  return e;
}
function levelInfo() {
  const exp = games.reduce((a, g) => a + gameExp(g), 0);
  let lv = 1, rest = exp, need = 100;
  while (rest >= need) { rest -= need; lv++; need = 100 + (lv - 1) * 25; }
  let title = TITLES[0][1];
  for (const [l, t] of TITLES) if (lv >= l) title = t;
  return { exp, lv, rest, need, title };
}

/* ---------- 画面: 一覧 ---------- */
function viewList() {
  setHeader(`<h1>RPG記録</h1><span class="lv">Lv.${levelInfo().lv}</span>`);
  const counts = { all: games.length };
  STATUS.forEach(s => counts[s.id] = games.filter(g => g.status === s.id).length);

  let list = games.filter(g => ui.tab === "all" || g.status === ui.tab);
  const q = ui.q.trim().toLowerCase();
  if (q) list = list.filter(g => [g.title, g.series, g.platform, g.genre].some(v => (v || "").toLowerCase().includes(q)));
  const cmp = {
    updated: (a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""),
    created: (a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0) || a.title.localeCompare(b.title, "ja"),
    title: (a, b) => a.title.localeCompare(b.title, "ja"),
  }[ui.sort];
  list.sort(cmp);

  const tabs = [{ id: "all", label: "すべて" }, ...STATUS]
    .map(t => `<button data-t="${t.id}" class="${ui.tab === t.id ? "on" : ""}">${t.label}<span class="n">${counts[t.id]}</span></button>`).join("");

  const row = g => `
    <li><a href="#/game/${g.id}">
      ${thumb(g)}
      <div class="g-main">
        <div class="g-title">${esc(g.title)}</div>
        <div class="g-sub">${esc([g.platform, g.genre, ui.group ? "" : g.series].filter(Boolean).join(" · ")) || "&nbsp;"}</div>
      </div>
      <div class="g-side">
        <div class="st ${g.status}">${STATUS_LABEL[g.status] || ""}</div>
        ${g.rating ? stars(g.rating) : ""}
      </div>
    </a></li>`;

  // 2本以上あるシリーズはひとまとめにする
  const sc = seriesCounts();
  const items = [];
  const groups = {};
  for (const g of list) {
    if (ui.group && g.series && sc[g.series] >= 2) {
      if (!groups[g.series]) { groups[g.series] = { series: g.series, members: [] }; items.push(groups[g.series]); }
      groups[g.series].members.push(g);
    } else items.push(g);
  }
  // グループの並び位置: 中の先頭（並べ替え基準で一番上のもの）に合わせる。タイトル順はシリーズ名で
  if (ui.sort === "title") items.sort((a, b) => (a.series && a.members ? a.series : a.title).localeCompare(b.series && b.members ? b.series : b.title, "ja", { numeric: true }));

  const groupHtml = grp => {
    const m = grp.members.slice().sort(byTitle);
    const open = ui.open.has(grp.series) || !!q;
    const cleared = m.filter(g => g.status === "cleared").length;
    const rated = m.filter(g => g.rating);
    const avg = rated.length ? Math.round(rated.reduce((a, g) => a + g.rating, 0) / rated.length) : 0;
    const cover = m.find(g => g.image) || m[0];
    return `<li class="grp ${open ? "open" : ""}">
      <button class="grp-head" data-s="${esc(grp.series)}">
        <div class="stack">${thumb({ title: grp.series, image: cover.image })}</div>
        <div class="g-main">
          <div class="g-title">${esc(grp.series)} <span class="caret">›</span></div>
          <div class="g-sub">${m.length}本 · クリア ${cleared}</div>
        </div>
        <div class="g-side">
          <div class="cnt">${m.length}</div>
          ${avg ? stars(avg) : ""}
        </div>
      </button>
      ${open ? `<ul>${m.map(row).join("")}</ul>` : ""}
    </li>`;
  };

  const rows = items.map(it => it.members ? groupHtml(it) : row(it)).join("");

  $("#app").innerHTML = `
    <div class="tabs">${tabs}</div>
    <div class="tools">
      <input type="search" id="q" placeholder="タイトル・シリーズで検索" value="${esc(ui.q)}">
      <select id="sort">
        <option value="updated">更新順</option>
        <option value="created">登録順</option>
        <option value="rating">評価順</option>
        <option value="title">タイトル順</option>
      </select>
    </div>
    <label class="note" style="display:flex;align-items:center;gap:6px;margin:-4px 0 4px"><input type="checkbox" id="grp" ${ui.group ? "checked" : ""}> シリーズをまとめて表示</label>
    ${list.length ? `<ul class="games">${rows}</ul>` :
      `<p class="empty">${games.length ? "該当するゲームはありません" : "まだ記録がありません。<br>右下の ＋ から追加できます。"}</p>`}
    <a class="fab" href="#/new" aria-label="追加">＋</a>`;

  $("#sort").value = ui.sort;
  $(".tabs").onclick = e => { const b = e.target.closest("button"); if (b) { ui.tab = b.dataset.t; viewList(); } };
  $("#sort").onchange = e => { ui.sort = e.target.value; viewList(); };
  $("#grp").onchange = e => { ui.group = e.target.checked; viewList(); };
  document.querySelectorAll(".grp-head").forEach(b => b.onclick = () => {
    const k = b.dataset.s;
    ui.open.has(k) ? ui.open.delete(k) : ui.open.add(k);
    const y = window.scrollY; viewList(); window.scrollTo(0, y);
  });
  $("#q").oninput = e => {
    ui.q = e.target.value;
    const pos = e.target.selectionStart;
    viewList();
    const q2 = $("#q"); q2.focus(); q2.setSelectionRange(pos, pos);
  };
}

/* ---------- 画面: 詳細 ---------- */
function viewDetail(id) {
  const g = find(id);
  if (!g) return go("#/");
  setHeader(`<a class="back" href="#/">← 一覧</a><span class="lv">${esc(STATUS_LABEL[g.status])}</span>`);

  const scores = SCORE_KEYS.filter(k => g.scores && g.scores[k.id]).map(k => `
    <div class="score-row"><span class="lab">${k.label}</span>
      <span class="pips">${[1,2,3,4,5].map(i => `<i class="${i <= g.scores[k.id] ? "on" : ""}"></i>`).join("")}</span>
      <span class="muted">${g.scores[k.id]}</span></div>`).join("");

  const kv = [["機種", g.platform], ["ジャンル", g.genre], ["シリーズ", g.series], ["好きなキャラ", g.favoriteChara], ["好きな曲", g.favoriteSong]]
    .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");

  const sibList = g.series ? games.filter(x => x.series === g.series).sort(byTitle) : [];
  const sibs = sibList.length >= 2 ? `<h2 class="sec">${esc(g.series)}シリーズ（${sibList.length}本）</h2>
    <ul class="sib">${sibList.map(x => x.id === g.id
      ? `<li><a class="cur"><span>${esc(x.title)}（このゲーム）</span><span>${x.rating ? stars(x.rating) : ""}</span></a></li>`
      : `<li><a href="#/game/${x.id}"><span>${esc(x.title)}</span><span>${x.rating ? stars(x.rating) : `<span class="st">${STATUS_LABEL[x.status]}</span>`}</span></a></li>`).join("")}</ul>` : "";
  $("#app").innerHTML = `
    <div class="d-head">
      ${thumb(g, "d-img")}
      <div>
        <h1 class="d-title">${esc(g.title)}</h1>
        <div class="d-meta">${esc(STATUS_LABEL[g.status])}</div>
        ${g.rating ? stars(g.rating) : `<div class="muted">評価なし</div>`}
      </div>
    </div>
    ${kv ? `<dl class="kv">${kv}</dl>` : ""}
    ${sibs}
    ${scores ? `<h2 class="sec">項目別の評価</h2>${scores}` : ""}
    <h2 class="sec">感想</h2>
    ${(g.review || "").trim() ? `<div class="text">${esc(g.review)}</div>` : `<p class="muted">まだ書いていません</p>`}
    ${(g.spoiler || "").trim() ? `
      <h2 class="sec">ネタバレあり</h2>
      <div class="spoiler"><button id="spb">タップして表示</button><div class="text hidden" id="spt">${esc(g.spoiler)}</div></div>` : ""}
    <div class="actions">
      <a class="btn solid" href="#/edit/${g.id}">編集する</a>
    </div>`;

  const spb = $("#spb");
  if (spb) spb.onclick = () => { spb.classList.add("hidden"); $("#spt").classList.remove("hidden"); };
}

/* ---------- 画面: 登録・編集 ---------- */
function viewEdit(id) {
  const orig = id ? find(id) : null;
  if (id && !orig) return go("#/");
  const g = orig ? structuredClone(orig) : { status: "cleared", rating: 0, scores: {}, image: null };
  g.scores = g.scores || {};
  setHeader(`<a class="back" href="${orig ? "#/game/" + orig.id : "#/"}">← 戻る</a><span class="lv">${orig ? "編集" : "新規登録"}</span>`);

  const dl = (idn, arr) => `<datalist id="${idn}">${arr.map(v => `<option value="${esc(v)}">`).join("")}</datalist>`;
  const platforms = uniq([...games.map(x => x.platform), ...PLATFORMS]);
  const genres = uniq([...games.map(x => x.genre), ...GENRES]);
  const series = uniq(games.map(x => x.series));

  $("#app").innerHTML = `
    <form id="f" autocomplete="off">
      <div class="f"><label class="l">タイトル <span class="req">*</span></label>
        <input type="text" name="title" value="${esc(g.title)}" required></div>
      <div class="f"><label class="l">状態</label>
        <div class="seg" id="seg">${STATUS.map(s => `<button type="button" data-v="${s.id}" class="${g.status === s.id ? "on" : ""}">${s.label}</button>`).join("")}</div></div>
      <div class="f"><label class="l">総合評価</label>
        <div class="star-in" id="rate">${[1,2,3,4,5].map(i => `<button type="button" data-v="${i}" class="${i <= g.rating ? "on" : ""}">★</button>`).join("")}</div></div>
      <div class="f"><label class="l">画像</label>
        <div class="img-in">
          <div class="d-img" id="imgp"></div>
          <div class="links">
            <label>画像を選ぶ<input type="file" accept="image/*" id="imgf" hidden></label>
            <button type="button" id="imgx">画像を外す</button>
          </div>
        </div></div>
      <div class="f"><label class="l">機種</label><input type="text" name="platform" list="dl-p" value="${esc(g.platform)}"></div>
      <div class="f"><label class="l">ジャンル</label><input type="text" name="genre" list="dl-g" value="${esc(g.genre)}"></div>
      <div class="f" style="display:flex;gap:14px">
        <div style="flex:1"><label class="l">シリーズ</label><input type="text" name="series" list="dl-s" value="${esc(g.series)}"></div>
        <div style="width:6.5em"><label class="l">シリーズ内の順番</label><input type="text" inputmode="numeric" name="seriesOrder" value="${g.seriesOrder || ""}" placeholder="例 3"></div>
      </div>

      <h2 class="sec">項目別の評価</h2>
      ${SCORE_KEYS.map(k => `
        <div class="score-row"><span class="lab">${k.label}</span>
          <div class="pip-in" data-k="${k.id}">${[1,2,3,4,5].map(i => `<button type="button" data-v="${i}" class="${i <= (g.scores[k.id] || 0) ? "on" : ""}">${i}</button>`).join("")}</div>
        </div>`).join("")}
      <p class="note">同じ数字をもう一度押すと未評価に戻ります。</p>

      <h2 class="sec">思い出</h2>
      <div class="f"><label class="l">好きなキャラ</label><input type="text" name="favoriteChara" value="${esc(g.favoriteChara)}"></div>
      <div class="f"><label class="l">好きな曲</label><input type="text" name="favoriteSong" value="${esc(g.favoriteSong)}"></div>
      <div class="f"><label class="l">感想</label><textarea name="review">${esc(g.review)}</textarea></div>
      <div class="f"><label class="l">ネタバレありの感想（詳細画面では隠して表示）</label><textarea name="spoiler">${esc(g.spoiler)}</textarea></div>

      <div class="actions" style="flex-direction:column;gap:12px">
        <button class="btn solid wide" type="submit">保存する</button>
        ${orig ? `<button class="btn danger wide" type="button" id="del">このゲームを削除</button>` : ""}
      </div>
      ${dl("dl-p", platforms)}${dl("dl-g", genres)}${dl("dl-s", series)}
    </form>`;

  const drawImg = () => { $("#imgp").innerHTML = g.image ? `<img src="${g.image}" alt="">` : "なし"; $("#imgx").classList.toggle("hidden", !g.image); };
  drawImg();

  $("#seg").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    g.status = b.dataset.v;
    $("#seg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  };
  $("#rate").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const v = +b.dataset.v; g.rating = g.rating === v ? 0 : v;
    $("#rate").querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.v <= g.rating));
  };
  document.querySelectorAll(".pip-in").forEach(row => row.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const k = row.dataset.k, v = +b.dataset.v;
    g.scores[k] = g.scores[k] === v ? 0 : v;
    row.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.v <= g.scores[k]));
  });
  $("#imgf").onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try { g.image = await shrinkImage(file); drawImg(); } catch { toast("画像を読み込めませんでした"); }
  };
  $("#imgx").onclick = () => { g.image = null; drawImg(); };

  $("#f").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const title = (fd.get("title") || "").trim();
    if (!title) return toast("タイトルを入力してください");
    const now = new Date().toISOString();
    const scores = {};
    SCORE_KEYS.forEach(k => { if (g.scores[k.id]) scores[k.id] = g.scores[k.id]; });
    const rec = {
      id: g.id || uid(),
      title,
      platform: (fd.get("platform") || "").trim(),
      genre: (fd.get("genre") || "").trim(),
      series: (fd.get("series") || "").trim(),
      seriesOrder: parseInt(String(fd.get("seriesOrder") || "").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)), 10) || 0,
      status: g.status,
      rating: g.rating || 0,
      scores,
      favoriteChara: (fd.get("favoriteChara") || "").trim(),
      favoriteSong: (fd.get("favoriteSong") || "").trim(),
      review: fd.get("review") || "",
      spoiler: fd.get("spoiler") || "",
      image: g.image || null,
      createdAt: g.createdAt || now,
      updatedAt: now,
    };
    const before = levelInfo().lv;
    await dbPut(rec);
    const i = games.findIndex(x => x.id === rec.id);
    if (i >= 0) games[i] = rec; else games.push(rec);
    const after = levelInfo().lv;
    toast(after > before ? `レベルが上がった！ Lv.${after}` : "保存しました");
    go("#/game/" + rec.id, true);
  };
  const del = $("#del");
  if (del) del.onclick = async () => {
    if (!(await yesNo(`「${orig.title}」を削除しますか？`, "削除する"))) return;
    await dbDel(orig.id);
    games = games.filter(x => x.id !== orig.id);
    toast("削除しました");
    go("#/", true);
  };
}

function shrinkImage(file, max = 640) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

/* ---------- 画面: 統計 ---------- */
function viewStats() {
  setHeader(`<h1>統計</h1>`);
  const L = levelInfo();
  const n = id => games.filter(g => g.status === id).length;
  const rated = games.filter(g => g.rating);
  const avg = rated.length ? (rated.reduce((a, g) => a + g.rating, 0) / rated.length).toFixed(1) : "–";

  const dist = (key, fallback) => {
    const m = {};
    games.forEach(g => { const k = g[key] || fallback; if (k) m[k] = (m[k] || 0) + 1; });
    const rows = Object.entries(m).sort((a, b) => b[1] - a[1]);
    if (!rows.length) return `<p class="muted">データがありません</p>`;
    const max = rows[0][1];
    return `<table class="dist">${rows.map(([k, v]) =>
      `<tr><td class="k">${esc(k)}</td><td><div class="b" style="width:${(v / max) * 100}%"></div></td><td class="v">${v}</td></tr>`).join("")}</table>`;
  };
  const ratingRows = (() => {
    const max = Math.max(1, ...[5,4,3,2,1].map(s => games.filter(g => g.rating === s).length));
    return `<table class="dist">${[5,4,3,2,1].map(s => {
      const v = games.filter(g => g.rating === s).length;
      return `<tr><td class="k">${"★".repeat(s)}</td><td>${v ? `<div class="b" style="width:${(v / max) * 100}%"></div>` : ""}</td><td class="v">${v}</td></tr>`;
    }).join("")}</table>`;
  })();
  const seriesRows = (() => {
    const m = {};
    games.forEach(g => { if (g.series) m[g.series] = (m[g.series] || 0) + 1; });
    const rows = Object.entries(m).sort((a, b) => b[1] - a[1]);
    if (!rows.length) return `<p class="muted">シリーズが登録されたゲームはありません</p>`;
    return `<dl class="kv">${rows.map(([k, v]) => `<dt style="grid-column:1/2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k)}</dt><dd style="text-align:right;font-family:var(--mono)">${v}本</dd>`).join("")}</dl>`;
  })();

  $("#app").innerHTML = `
    <div class="level">
      <div class="big">Lv.${L.lv}<small>${esc(L.title)}</small></div>
      <div class="bar"><div style="width:${(L.rest / L.need) * 100}%"></div></div>
      <div class="note">次のレベルまで ${L.need - L.rest} EXP ／ 累計 ${L.exp} EXP</div>
    </div>
    <div class="nums">
      <div><b>${games.length}</b><span>登録</span></div>
      <div><b>${n("cleared")}</b><span>クリア</span></div>
      <div><b>${n("playing")}</b><span>プレイ中</span></div>
      <div><b>${avg}</b><span>平均評価</span></div>
    </div>
    <h2 class="sec">状態</h2>
    <table class="dist">${(() => { const max = Math.max(1, ...STATUS.map(s => n(s.id)));
      return STATUS.map(s => `<tr><td class="k">${s.label}</td><td>${n(s.id) ? `<div class="b" style="width:${n(s.id) / max * 100}%"></div>` : ""}</td><td class="v">${n(s.id)}</td></tr>`).join(""); })()}</table>
    <h2 class="sec">評価の分布</h2>${ratingRows}
    <h2 class="sec">ジャンル</h2>${dist("genre", "未設定")}
    <h2 class="sec">機種</h2>${dist("platform", "未設定")}
    <h2 class="sec">シリーズ</h2>${seriesRows}
    <h2 class="sec">経験値のしくみ</h2>
    <p class="note">クリア +100 ／ プレイ中 +30 ／ 中断 +20 ／ 評価をつける +10 ／ 感想を書く +20 ／ 画像を登録 +5</p>`;
}

/* ---------- 画面: 設定 ---------- */
function viewSettings() {
  setHeader(`<h1>設定</h1>`);
  $("#app").innerHTML = `
    <h2 class="sec">バックアップ</h2>
    <p class="note">データはこのスマホのブラウザの中だけに保存されています。機種変更やブラウザのデータ削除に備えて、ときどき書き出しておいてください。</p>
    <div class="actions" style="flex-direction:column;gap:12px;margin-top:12px">
      <button class="btn solid wide" id="exp">データを書き出す（JSON）</button>
      <label class="btn wide">データを読み込む<input type="file" accept="application/json,.json" id="imp" hidden></label>
    </div>
    <h2 class="sec">データの削除</h2>
    <div class="actions" style="margin-top:12px"><button class="btn danger wide" id="wipe">すべてのデータを削除</button></div>
    <p class="note" style="margin-top:28px">登録数 ${games.length} 本</p>`;

  $("#exp").onclick = () => {
    const data = JSON.stringify({ app: "rpg-log", version: 1, exportedAt: new Date().toISOString(), games }, null, 2);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const d = new Date();
    a.download = `rpg-log-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $("#imp").onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const obj = JSON.parse(await file.text());
      const list = Array.isArray(obj) ? obj : obj.games;
      if (!Array.isArray(list)) throw 0;
      const valid = list.filter(x => x && x.id && x.title);
      const mode = await ask(`${valid.length} 本のデータがあります。読み込み方を選んでください。`, [
        { label: "今のデータに追加する", value: "merge", cls: "solid" },
        { label: "今のデータを消して置き換える", value: "replace", cls: "danger" },
        { label: "やめる", value: null },
      ]);
      if (!mode) { e.target.value = ""; return; }
      const replace = mode === "replace";
      if (replace) { await dbClear(); games = []; }
      for (const g of valid) {
        await dbPut(g);
        const i = games.findIndex(x => x.id === g.id);
        if (i >= 0) games[i] = g; else games.push(g);
      }
      toast(`${valid.length} 本を読み込みました`);
      viewSettings();
    } catch { toast("このファイルは読み込めません"); }
    e.target.value = "";
  };
  $("#wipe").onclick = async () => {
    if (!(await yesNo("すべてのデータを削除します。元に戻せません。よろしいですか？", "すべて削除する"))) return;
    await dbClear(); games = []; toast("削除しました"); viewSettings();
  };
}

/* ---------- ルーター ---------- */
function setHeader(html) { $("#top").innerHTML = html; }
function go(hash, replace) {
  if (replace) { history.replaceState(null, "", hash); route(); }
  else location.hash = hash;
}
function route() {
  const h = location.hash.replace(/^#/, "") || "/";
  const [, a, b] = h.split("/");
  const tab = a === "stats" ? "stats" : a === "settings" ? "settings" : "list";
  document.querySelectorAll("#nav a").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
  $("#nav").classList.toggle("hidden", a === "new" || a === "edit");
  if (route.last === "list") ui.scroll = window.scrollY;
  route.last = a === "stats" || a === "settings" || a === "game" || a === "new" || a === "edit" ? a : "list";
  window.scrollTo(0, 0);
  if (a === "game") viewDetail(b);
  else if (a === "new") viewEdit(null);
  else if (a === "edit") viewEdit(b);
  else if (a === "stats") viewStats();
  else if (a === "settings") viewSettings();
  else { viewList(); if (ui.scroll) window.scrollTo(0, ui.scroll); }
}
window.addEventListener("hashchange", route);

(async () => {
  try { games = await dbAll(); } catch { games = []; toast("データを読み込めませんでした"); }
  route();
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
